<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2a94" />
      <stop offset="100%" stop-color="#051454" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Outer Shield Border -->
  <path d="M70 30 Q250 80 430 30 Q450 350 250 450 Q50 350 70 30 Z" fill="#ffffff" stroke="#0c237e" stroke-width="14" stroke-linejoin="round" />
  
  <!-- Inner Shield Body -->
  <path d="M85 48 Q250 94 415 48 Q433 335 250 432 Q67 335 85 48 Z" fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="6" />

  <!-- STARLIGHT S.S Text at Top of Shield -->
  <path id="textArc" d="M 110,88 Q 250,135 390,88" fill="none" />
  <text font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle">
    <textPath href="#textArc" startOffset="50%">STARLIGHT S.S</textPath>
  </text>

  <!-- Central Star -->
  <polygon points="250,140 257,162 280,162 261,176 268,198 250,184 232,198 239,176 220,162 243,162" fill="#ffffff" />

  <!-- Left Dove -->
  <g transform="translate(145, 175) scale(0.75)">
    <path d="M40 30 Q10 10 0 40 Q20 50 35 45 Q20 70 50 60 Q70 50 65 30 Z" fill="#ffffff" />
    <path d="M20 25 Q40 5 60 20 Q40 35 20 25 Z" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Right Dove -->
  <g transform="translate(355, 175) scale(-0.75, 0.75)">
    <path d="M40 30 Q10 10 0 40 Q20 50 35 45 Q20 70 50 60 Q70 50 65 30 Z" fill="#ffffff" />
    <path d="M20 25 Q40 5 60 20 Q40 35 20 25 Z" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Open Book -->
  <g transform="translate(160, 270)">
    <!-- Book Shadow/Base -->
    <path d="M0 45 Q90 60 180 45 L180 85 Q90 100 0 85 Z" fill="#06123d" />
    <!-- Left Page -->
    <path d="M5 40 Q90 55 90 80 Q5 65 5 40 Z" fill="#ffffff" stroke="#0e2a94" stroke-width="2" />
    <!-- Right Page -->
    <path d="M175 40 Q90 55 90 80 Q175 65 175 40 Z" fill="#ffffff" stroke="#0e2a94" stroke-width="2" />
    <!-- Page Lines Left -->
    <line x1="20" y1="48" x2="75" y2="54" stroke="#0e2a94" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="56" x2="75" y2="62" stroke="#0e2a94" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="64" x2="75" y2="70" stroke="#0e2a94" stroke-width="3" stroke-linecap="round" />
    <!-- Page Lines Right -->
    <line x1="105" y1="54" x2="160" y2="48" stroke="#0e2a94" stroke-width="3" stroke-linecap="round" />
    <line x1="105" y1="62" x2="160" y2="56" stroke="#0e2a94" stroke-width="3" stroke-linecap="round" />
    <line x1="105" y1="70" x2="160" y2="64" stroke="#0e2a94" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Ribbon Banner at Bottom -->
  <g transform="translate(0, 420)">
    <!-- Banner Ribbon Background -->
    <path d="M 30 50 L 80 10 L 80 70 Z" fill="#071754" />
    <path d="M 470 50 L 420 10 L 420 70 Z" fill="#071754" />
    
    <!-- Main Banner Arc -->
    <path d="M 50 40 Q 250 110 450 40 L 420 90 Q 250 160 80 90 Z" fill="#ffffff" stroke="#0c237e" stroke-width="8" stroke-linejoin="round" />
    
    <!-- Text arc for motto -->
    <path id="mottoArc" d="M 65 68 Q 250 135 435 68" fill="none" />
    <text font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="34" fill="#0c237e" text-anchor="middle">
      <textPath href="#mottoArc" startOffset="50%">RISE AND SHINE</textPath>
    </text>
  </g>
</svg>
