# Always use with docker-compose.yml and a unique --project-name from tenantctl.
# No host ports for databases, brokers, or backends. Only the frontend is
# reachable through the host's trusted reverse proxy.
services:
  backend:
    environment:
      TENANT_ID: ${TENANT_ID:?Set TENANT_ID}
      SUBSCRIPTION_POLICY_FILE: /run/convenecore-entitlements/subscription.json
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-Workspace Administrator}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?Set tenant HTTPS URL}
      SMTP_VERIFY_TLS: "true"
      MEETING_TURN_SECRET_FILE: /run/minuteseal-turn/secret
    volumes:
      - ${TENANT_POLICY_DIR:?Set tenant entitlement directory}:/run/convenecore-entitlements:ro
      - ${MINUTESEAL_TURN_DIR:-/var/lib/minuteseal-turn/credentials}:/run/minuteseal-turn:ro
  worker:
    environment:
      TENANT_ID: ${TENANT_ID:?Set TENANT_ID}
      SUBSCRIPTION_POLICY_FILE: /run/convenecore-entitlements/subscription.json
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?Set tenant HTTPS URL}
      SMTP_VERIFY_TLS: "true"
    volumes:
      - ${TENANT_POLICY_DIR:?Set tenant entitlement directory}:/run/convenecore-entitlements:ro
    depends_on:
      backend:
        condition: service_healthy
  frontend:
    ports:
      - "127.0.0.1:${FRONTEND_PORT:?Set FRONTEND_PORT}:3000"
