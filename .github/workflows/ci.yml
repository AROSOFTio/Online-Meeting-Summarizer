name: OMS Verification

on:
  push:
    branches:
      - main
      - 'audit/**'
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install FFmpeg and PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg postgresql-client
      - name: Install Python dependencies
        run: |
          set -o pipefail
          pip install -r requirements.txt 2>&1 | tee dependency-output.txt
      - name: Reject legacy transcription-provider references
        run: python scripts/audit_legacy_transcription_refs.py
      - name: Run backend test suite
        env:
          TESTING: 'true'
          DATABASE_URL: sqlite:///./test_meeting_summarizer.db
          ADMIN_EMAIL: testadmin@starlight.sc.ug
          ADMIN_PASSWORD: TestAdminPass123!
          SECRET_KEY: ci-only-secret-key
          MOCK_TRANSCRIPTION: 'true'
        run: pytest -q
      - name: Upload backend dependency diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-dependency-output
          path: backend/dependency-output.txt
          if-no-files-found: ignore
      - name: Report backend verification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          state="$JOB_STATUS"
          if [ "$state" = "cancelled" ]; then state="error"; fi
          curl --fail-with-body -sS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d "{\"state\":\"$state\",\"context\":\"oms-ci/backend\",\"description\":\"Backend pytest verification\"}"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint-output.txt
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
        run: npm run build
      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lint-output
          path: frontend/lint-output.txt
          if-no-files-found: ignore
      - name: Report frontend verification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          state="$JOB_STATUS"
          if [ "$state" = "cancelled" ]; then state="error"; fi
          curl --fail-with-body -sS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d "{\"state\":\"$state\",\"context\":\"oms-ci/frontend\",\"description\":\"Frontend lint typecheck and build\"}"
