name: OMS Verification

on:
  push:
    branches:
      - main
      - 'audit/**'
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  tenant-provisioning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify isolated tenant provisioning
        run: python -m unittest discover -s deploy -p "test_*.py" -v

  two-organization-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TENANT_TEST_ROOT: ${{ runner.temp }}/convenecore-isolation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Provision two disposable organizations
        run: |
          set -eu
          python deploy/tenantctl.py --root "$TENANT_TEST_ROOT" provision alpha --host alpha.example.com --admin-email admin@example.com --port 19081
          python deploy/tenantctl.py --root "$TENANT_TEST_ROOT" provision bravo --host bravo.example.com --admin-email admin@example.com --port 19082
      - name: Start isolated stacks
        run: |
          set -eu
          python deploy/tenantctl.py --root "$TENANT_TEST_ROOT" start alpha
          python deploy/tenantctl.py --root "$TENANT_TEST_ROOT" start bravo
      - name: Verify infrastructure boundaries and application isolation
        run: |
          set -eu
          python deploy/verify_isolated_infrastructure.py --root "$TENANT_TEST_ROOT" alpha bravo
          python deploy/smoke_isolation.py --root "$TENANT_TEST_ROOT" alpha bravo
      - name: Remove disposable staging stacks
        if: always()
        run: |
          for tenant in alpha bravo; do
            if [ -f "$TENANT_TEST_ROOT/$tenant/tenant.env" ]; then
              docker compose --project-name "cc-$tenant" --env-file "$TENANT_TEST_ROOT/$tenant/tenant.env" -f docker-compose.yml -f deploy/compose.tenant.yml down --volumes --remove-orphans
            fi
          done

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install FFmpeg and PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg postgresql-client
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Reject legacy transcription-provider references
        run: python scripts/audit_legacy_transcription_refs.py
      - name: Run backend test suite
        env:
          TESTING: 'true'
          DATABASE_URL: sqlite:///./test_meeting_summarizer.db
          ADMIN_EMAIL: testadmin@starlight.sc.ug
          ADMIN_PASSWORD: TestAdminPass123!
          SECRET_KEY: ci-only-secret-key
          MOCK_TRANSCRIPTION: 'true'
        run: python -m pytest -q
      - name: Report backend verification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          state="$JOB_STATUS"
          if [ "$state" = "cancelled" ]; then state="error"; fi
          curl --fail-with-body -sS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d "{\"state\":\"$state\",\"context\":\"oms-ci/backend\",\"description\":\"Backend pytest verification\"}"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
        run: npm run build
      - name: Report frontend verification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          state="$JOB_STATUS"
          if [ "$state" = "cancelled" ]; then state="error"; fi
          curl --fail-with-body -sS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d "{\"state\":\"$state\",\"context\":\"oms-ci/frontend\",\"description\":\"Frontend lint typecheck and build\"}"
